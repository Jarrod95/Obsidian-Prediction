[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "obsidian-prediction"
version = "0.1.0"
description = "Fail-closed prediction-market research platform"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1", "python-dotenv>=1,<2"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]
telegram = ["python-telegram-bot>=21,<23"]
[project.scripts]
obsidian-prediction = "obsidian_prediction.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
